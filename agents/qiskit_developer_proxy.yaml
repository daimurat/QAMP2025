agent_id: qiskit_developer_proxy
name: QiskitDeveloperProxy
type: user_proxy

description: |
  Proxy that executes generated Qiskit code and provides feedback.
  When code fails, the error is fed back to QiskitDeveloper for fixing.

proxy_config:
  human_input_mode: NEVER
  # Allow up to 3 retry iterations for code fixing
  max_consecutive_auto_reply: 3
  code_execution_config:
    work_dir: work
    # Execute code from the last 3 messages to capture corrections
    last_n_messages: 3
    use_docker: false
    # Timeout for code execution (seconds)
    timeout: 60

